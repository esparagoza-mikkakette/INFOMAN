<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Medical Record System</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-bg">
            <img src="../../assets/pdmhs/pdmhs_campus.jpg" alt="Campus" class="campus-bg">
        </div>
        <div class="login-form-wrapper">
            <form class="login-form">
                <img src="../../assets/pdmhs/pdmhs_logo.jpg" alt="PDMHS Logo" class="school-logo">
                <h2>President Diosdado Macapagal High School</h2>
                <h3>Student Medical Record System</h3>
                <p class="login-instruction">Sign in to start your session</p>
                
                <div class="user-type-selector">
                    <label class="user-type-label">Login as:</label>
                    <div class="user-type-options">
                        <input type="radio" id="student" name="userType" value="student" checked>
                        <label for="student" class="user-type-option">Student</label>
                        
                        <input type="radio" id="faculty" name="userType" value="faculty">
                        <label for="faculty" class="user-type-option">Faculty Staff</label>
                        
                        <input type="radio" id="clinic" name="userType" value="clinic">
                        <label for="clinic" class="user-type-option">Clinic Staff</label>
                    </div>
                </div>

                <input type="text" placeholder="Student LRN" required>
                <div class="birthdate-fields">
                    <select required>
                        <option value="">Month</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select required>
                        <option value="">Day</option>
                        <option value="01">1</option>
                        <option value="02">2</option>
                        <option value="03">3</option>
                        <option value="04">4</option>
                        <option value="05">5</option>
                        <option value="06">6</option>
                        <option value="07">7</option>
                        <option value="08">8</option>
                        <option value="09">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>
                    <select required>
                        <option value="">Year</option>
                        <option value="2006">2006</option>
                        <option value="2005">2005</option>
                        <option value="2004">2004</option>
                        <option value="2003">2003</option>
                        <option value="2002">2002</option>
                        <option value="2001">2001</option>
                        <option value="2000">2000</option>
                        <option value="1999">1999</option>
                        <option value="1998">1998</option>
                        <option value="1997">1997</option>
                        <option value="1996">1996</option>
                    </select>
                </div>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn-login">Sign in</button>
                <a href="#" class="forgot-password">I forgot my password</a>
                <a href="../register/register.html" class="register-link">Don't have an account? Register</a>
            </form>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
